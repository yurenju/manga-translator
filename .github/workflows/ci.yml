# 型別檢查＋單元測試＋網站 build；browser test 另一個 job（FakeEngine，不下載模型）。
# e2e 不在這裡跑：要下載模型，而且受機器速度影響。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 原生跑 .ts（scripts/、vitest 的設定檔）
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run site:build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # fixtures 用 Playwright 內建的 Chromium（channel: 'chromium'）載入外掛
      - run: npx playwright install --with-deps chromium
      # 會先 build:e2e、site:build；globalSetup 用 wrangler dev 起本機 Worker
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
