<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>漫畫翻譯</title>
    <script type="module" src="sidepanel.js"></script>
    <style>
      [aria-label='逐字稿'] li { display: flex; flex-direction: column; margin-bottom: 0.5em; }
      .loose { font-style: italic; }
      .reading { color: #2a6fb0; font-size: 0.85em; }
      .untranslated { color: #888; font-size: 0.85em; }
      .error, [role='alert'] { color: #b00020; }
      .unreadable { color: #888; text-decoration: line-through; }
      .unreadable-label { color: #888; font-size: 0.85em; }
      .settings { border: 1px solid #ccc; padding: 0.5em; margin: 0.5em 0; }
      .settings .hint { color: #555; font-size: 0.85em; }
      footer { position: sticky; bottom: 0; background: #fff; border-top: 1px solid #ccc; padding: 0.5em 0; display: flex; gap: 0.5em; align-items: center; justify-content: space-between; flex-wrap: wrap; }
      .series, .series form { display: flex; flex-wrap: wrap; gap: 0.25em; align-items: center; }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
