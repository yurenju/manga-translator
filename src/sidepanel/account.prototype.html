<!doctype html>
<!--
  PROTOTYPE（spec #86 的外掛帳號畫面，用完即丟，不合回 main）。
  問題：#91–#95 在外掛新增的畫面「長什麼樣」——全頁 onboarding、side panel 的額度狀態、設定區的翻譯方式與帳號。
  每個畫面有三個結構不同的版本，用 ?variant=A|B|C（或底部的切換列、← → 鍵）切換；?screen= 選畫面，?state= 選狀態。
  side panel 與設定區直接載入真正的 tokens.css、components.css、sidepanel.css，放在 shadow DOM 裡，跟現有版面一起比較。
  直接用瀏覽器打開這個檔案即可，不需要建置。沒有任何網路請求：寄信、付款都是假的（驗證碼輸入 123456 會成功，000000 會過期）。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naruhodo 帳號畫面 — prototype</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  /* prototype 自己的外框（控制列、假瀏覽器、切換列）：刻意用深色，跟被評估的設計分開 */
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--naru-font-sans); background: #3b3a37; color: #eee; }
  .pt-bar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: #1d1c1a; font-size: 13px; }
  .pt-bar strong { color: #fff; }
  .pt-tabs { display: inline-flex; gap: 4px; }
  .pt-tabs button, .pt-states button { border: 1px solid #555; background: #2a2926; color: #ddd; border-radius: 999px; padding: 3px 10px; font: inherit; cursor: pointer; }
  .pt-tabs button[aria-pressed='true'], .pt-states button[aria-pressed='true'] { background: #f2c94c; color: #1d1c1a; border-color: #f2c94c; font-weight: 700; }
  .pt-states { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px; background: #26251f; font-size: 12px; }
  .pt-states span { color: #aaa; align-self: center; margin-right: 4px; }
  .pt-dump { margin-left: auto; font-family: var(--naru-font-mono); font-size: 11px; color: #9c9; }
  .pt-note { padding: 6px 16px; font-size: 12px; color: #f2c94c; background: #2a2926; }
  .pt-stage { display: flex; justify-content: center; padding: 20px 16px 96px; }
  /* 假瀏覽器：左邊是漫畫頁（截圖），右邊是 side panel */
  .pt-window { display: flex; width: min(1180px, 100%); height: 680px; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .pt-page { flex: 1 1 auto; background: #f0efec url('../../docs/images/overview.webp') left -8px top -84px / auto 780px no-repeat; }
  .pt-sidepanel { flex: none; width: 380px; display: flex; flex-direction: column; border-left: 1px solid #ccc; background: #fff; }
  .pt-sidepanel__chrome { flex: none; display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; background: #dfe3ea; color: #333; font-size: 13px; }
  .pt-sidepanel__body { flex: 1 1 auto; overflow: auto; position: relative; }
  /* onboarding：一個全頁分頁 */
  .pt-tab { width: min(1180px, 100%); background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .pt-tab__chrome { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; background: #dfe3ea; color: #333; font-size: 13px; }
  .pt-tab__url { flex: 1; background: #fff; border-radius: 999px; padding: 3px 12px; color: #555; font-family: var(--naru-font-mono); font-size: 12px; }
  .pt-tab__body { min-height: 640px; }
  /* 底部的版本切換列 */
  .pt-switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 4px; padding: 6px; background: #111; color: #fff; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,.5); font-size: 14px; }
  .pt-switcher button { width: 36px; height: 36px; border: 0; border-radius: 999px; background: #333; color: #fff; font-size: 18px; cursor: pointer; }
  .pt-switcher button:hover { background: #555; }
  .pt-switcher span { min-width: 220px; text-align: center; font-weight: 700; }
</style>
</head>
<body>
<div id="bar"></div>
<div class="pt-stage" id="stage"></div>
<div class="pt-switcher" role="group" aria-label="切換版本">
  <button type="button" id="prev" aria-label="上一個版本">←</button>
  <span id="variant-label"></span>
  <button type="button" id="next" aria-label="下一個版本">→</button>
</div>

<script>
// ========================= 狀態 =========================
const params = new URLSearchParams(location.search);
const S = {
  screen: params.get('screen') ?? 'onboarding',
  variant: params.get('variant') ?? 'A',
  // side panel 的額度狀態
  panelState: params.get('state') ?? 'free',
  // 設定區的狀態
  settingsState: params.get('settings') ?? 'hostedFree',
  // onboarding：step 1–4，sub 是步驟裡的子狀態；ownkey＝頁尾「使用自備金鑰」的分支
  step: Number(params.get('step') ?? 1),
  sub: params.get('sub') ?? '',
  email: 'reader@example.com',
  code: '',
  wrongTries: 0,
  resendIn: 0,
  hintDismissed: false,
  quotaOpen: false,
  deleting: false,
  deleteTyped: '',
  done: false,
};

const VARIANT_NAMES = {
  onboarding: { A: '單欄步驟精靈', B: '左側步驟清單＋右側內容', C: '一頁長捲、逐段解鎖' },
  panel: { A: '額度放在底部狀態列', B: '額度是頂部的徽章', C: '額度是一張帳號卡' },
  settings: { A: '卡片版面・刪除確認是另一頁', B: '卡片版面・刪除確認原地展開' },
};

const PANEL_STATES = {
  setup: '沒做完 onboarding',
  signedOut: '未登入（登出、刪帳號後）',
  free: '免費，剩 37 頁',
  freeLow: '免費，剩 3 頁',
  sub: '訂閱中，本月剩 612 頁',
  exFree: '免費額度用完',
  exMonthly: '本月額度用完',
  ownKeyHint: '自備金鑰＋內建翻譯提示（一次）',
  ownKey: '自備金鑰（提示關掉後）',
};

const SETTINGS_STATES = {
  hostedFree: '內建翻譯・免費',
  hostedSub: '內建翻譯・訂閱中',
  hostedCanceling: '內建翻譯・訂閱排定取消',
  hostedPastDue: '內建翻譯・扣款失敗重試中',
  hostedSignedOut: '內建翻譯・未登入',
  ownKeyLoggedIn: '自備金鑰（帳號仍登入）',
  ownKeyNoAccount: '自備金鑰（沒有帳號）',
};

const ONBOARDING_STATES = {
  '1:': '1 說明',
  '2:email': '2 輸入 email',
  '2:rateLimited': '2 寄太頻繁',
  '2:code': '2 輸入驗證碼',
  '2:codeWrong': '2 驗證碼錯誤',
  '2:codeExpired': '2 驗證碼過期',
  '2:tooMany': '2 嘗試太多次',
  '3:choose': '3 選方案',
  '3:waitingPayment': '3 等待付款',
  '3:paid': '3 付款完成',
  '4:': '4 教學',
  '0:ownkey': '頁尾：使用自備金鑰',
  '5:done': '完成',
};

function syncUrl() {
  const p = new URLSearchParams({ screen: S.screen, variant: S.variant });
  if (S.screen === 'panel') p.set('state', S.panelState);
  if (S.screen === 'settings') p.set('settings', S.settingsState);
  if (S.screen === 'onboarding') { p.set('step', S.step); if (S.sub) p.set('sub', S.sub); }
  history.replaceState(null, '', `?${p}`);
}

// ========================= 共用片段（現有元件的 HTML 形狀） =========================
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const btn = (label, { variant = 'secondary', act = '', extra = '', attrs = '' } = {}) =>
  `<button type="button" class="naru-btn naru-btn--${variant} ${extra}" ${act ? `data-act="${act}"` : ''} ${attrs}>${label}</button>`;
const badge = (label, tone = 'neutral') =>
  `<span class="naru-badge naru-badge--${tone}">${tone === 'ok' ? '<span class="naru-badge__dot" aria-hidden="true"></span>' : ''}${label}</span>`;
const callout = (inner, tone = 'info', attrs = '') => `<div class="naru-callout naru-callout--${tone}" ${attrs}>${inner}</div>`;
const seg = (label, options, value, size = 'sm', act = '') =>
  `<div role="group" aria-label="${label}" class="naru-seg naru-seg--${size}" style="grid-template-columns: repeat(${options.length}, minmax(0, 1fr))">${options
    .map((o) => `<button type="button" aria-pressed="${o.value === value}" ${act ? `data-act="${act}" data-value="${o.value}"` : ''}><span class="naru-seg__label">${o.label}</span>${size === 'lg' && o.description ? `<span class="naru-seg__desc">${o.description}</span>` : ''}</button>`)
    .join('')}</div>`;
const r = (base, rt) => `<ruby>${base}<rt>${rt}</rt></ruby>`;
const GEAR = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`;
const PENCIL = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`;
const PAGE_ICON = `<svg class="naru-page-header__icon" viewBox="0 0 19 14" width="19" height="14" aria-hidden="true"><rect x="1.5" y="0.5" width="7" height="13" rx="1.5"/><rect class="lit" x="10.5" y="0.5" width="7" height="13" rx="1.5"/></svg>`;
const LOGO = `<img src="../icons/naruhodo.svg" alt="" width="24" height="24">`;

const LINES = [
  { ja: `${r('突如', 'とつじょ')}${r('現', 'あらわ')}れた${r('巨大', 'きょだい')}な${r('影', 'かげ')}——`, zh: '突然出現的巨大黑影——', guess: true },
  { ja: 'ガガガガ…', zh: '轟轟轟轟…', loose: true },
  { ja: `${r('街', 'まち')}が…${r('崩壊', 'ほうかい')}していく…！`, zh: '城鎮……正在崩毀……！', guess: true },
  { ja: `${r('逃', 'に')}げるんだ、${r('勝', 'か')}てるわけがない！`, zh: '快逃！根本不可能贏的！', guess: true },
];

/** 逐字稿：translated=false 時只有原文、讀音與「未翻譯」，就像額度用完、未登入時。 */
function transcript(translated, status) {
  const lines = LINES.map((l) => `<li>
      <span lang="ja" class="original with-ruby">${l.ja}</span>
      ${l.loose || l.guess ? `<span class="badges">${l.loose ? badge('框外文字', 'loose') : ''}${l.guess ? badge('讀音為推測', 'warn') : ''}</span>` : ''}
      ${translated ? `<span lang="zh-Hant" class="translation">${l.zh}</span>` : '<span class="untranslated">未翻譯</span>'}
    </li>`).join('');
  return `<ul aria-label="Page"><li>
    <div class="naru-page-header">${PAGE_ICON}<h2 class="naru-page-header__title">右頁<span class="naru-page-header__order"> · 先讀</span></h2>
      ${status ? `<div class="naru-page-header__status"><p class="translation-status">${status}</p></div>` : ''}</div>
    <ol aria-label="逐字稿">${lines}</ol></li></ul>`;
}

const pageModeSwitch = () => seg('頁面模式', [
  { value: 'read', label: '閱讀', description: '頁面直接顯示中文' },
  { value: 'learn', label: '學習', description: '保留日文，滑過看讀音' },
], 'read', 'lg');

const levels = () => `<div class="levels">${seg('顯示層級', ['只看譯文', '原文＋譯文', '加振り仮名'].map((l) => ({ value: l, label: l })), '加振り仮名')}</div>`;

function header(extra = '') {
  return `<div class="panel-header"><h1 class="title">${LOGO}Naruhodo</h1>${badge('已啟動', 'ok')}${extra}<span class="panel-header__spacer"></span>${btn('停止', { variant: 'ghost' })}<div class="panel-menu">${btn(GEAR, { variant: 'icon', act: 'goSettings', attrs: 'aria-label="設定"' })}</div></div>`;
}

function footer(statusText, button, extraRow = '') {
  return `<footer aria-label="狀態列">
    <div role="group" aria-label="系列" class="series-row"><span class="series-row__label">系列</span><span class="series-row__name">未歸類（未命名・shonenjumpplus.com・10/30）</span>${btn(PENCIL, { variant: 'icon', attrs: 'aria-label="改系列名稱"' })}</div>
    ${extraRow}
    <div class="status-row"><span>${statusText}</span>${button}</div>
  </footer>`;
}

// ========================= 額度資料 =========================
/** 每個 side panel 狀態對應的資料；mode：hosted／ownKey／setup。 */
function quota(state) {
  return {
    setup: { mode: 'setup' },
    signedOut: { mode: 'hosted', signedIn: false, canTranslate: false },
    free: { mode: 'hosted', signedIn: true, plan: 'free', free: 37, canTranslate: true },
    freeLow: { mode: 'hosted', signedIn: true, plan: 'free', free: 3, canTranslate: true, low: true },
    sub: { mode: 'hosted', signedIn: true, plan: 'sub', monthLeft: 612, monthLimit: 800, reset: '11 月 15 日', canTranslate: true },
    exFree: { mode: 'hosted', signedIn: true, plan: 'free', free: 0, canTranslate: false, reason: 'free' },
    exMonthly: { mode: 'hosted', signedIn: true, plan: 'sub', monthLeft: 0, monthLimit: 800, reset: '11 月 15 日', canTranslate: false, reason: 'monthly' },
    ownKeyHint: { mode: 'ownKey', hint: true, canTranslate: true },
    ownKey: { mode: 'ownKey', hint: false, canTranslate: true },
  }[state];
}

/** 一行文字的剩餘頁數（A、B 版共用的文案）。 */
function remainingText(q) {
  if (q.plan === 'free') return `免費額度剩 ${q.free} 頁`;
  return `本月剩 ${q.monthLeft} 頁・${q.reset}重置`;
}

/** 額度用完的原因（三個版本共用的文案）。 */
function exhaustedTitle(q) {
  return q.reason === 'free' ? '免費額度已用完' : `本月額度已用完，${q.reset}重置`;
}
function exhaustedBody(q) {
  return q.reason === 'free'
    ? '已翻過的頁面照常顯示譯文；新的頁面先顯示原文與讀音。訂閱後每月可翻 800 頁。'
    : '已翻過的頁面照常顯示譯文；新的頁面先顯示原文與讀音，重置後就能繼續翻。';
}
const ownKeyLink = (cls = 'proto-small-link') => `<button type="button" class="${cls}" data-act="useOwnKey">使用自備金鑰</button>`;

// ========================= side panel：三個版本 =========================
function setupScreen(v) {
  if (v === 'A')
    return `<div class="panel-header"><h1 class="title">${LOGO}Naruhodo</h1><span class="panel-header__spacer"></span></div>
      ${callout(`<p><strong>還差一步就能開始翻譯</strong></p><p>設定還沒完成：登入帳號，或改用自備金鑰。</p>${btn('完成設定', { variant: 'primary', act: 'goOnboarding' })}`, 'info', 'style="flex-direction:column;align-items:flex-start"')}`;
  if (v === 'B')
    return `<div class="proto-empty">${LOGO.replace('24', '48').replace('24', '48')}<h2>Naruhodo</h2><p>設定還沒完成</p>${btn('完成設定', { variant: 'primary', act: 'goOnboarding' })}</div>`;
  return `<div class="proto-empty">${LOGO.replace('24', '48').replace('24', '48')}<h2>還差一步</h2>
    <ol class="proto-mini-steps"><li class="done">說明</li><li class="done">登入</li><li class="cur">選擇方案</li><li>開始翻譯</li></ol>
    ${btn('完成設定', { variant: 'primary', act: 'goOnboarding' })}<p class="hint">會回到剛才停下來的那一步</p></div>`;
}

const ownKeyHintText = '現在也可以改用內建翻譯：用 email 登入就能翻，不用自備 API key。新帳號有 50 頁免費額度。';

function panelA(q) {
  // 額度一行放在底部狀態列；用完、未登入、提示都是逐字稿上方的 Callout
  let top = '';
  if (q.mode === 'hosted' && !q.signedIn)
    top = callout(`<p><strong>尚未登入</strong>：只顯示原文與讀音。</p><div class="proto-row">${btn('登入', { variant: 'primary', act: 'goOnboardingLogin' })}${ownKeyLink()}</div>`, 'warn', 'style="flex-direction:column;align-items:flex-start"');
  if (q.reason)
    top = callout(`<p><strong>${exhaustedTitle(q)}</strong></p><p>${exhaustedBody(q)}</p><div class="proto-row">${q.reason === 'free' ? btn('訂閱', { variant: 'primary', act: 'subscribe' }) : ''}${ownKeyLink()}</div>`, 'warn', 'style="flex-direction:column;align-items:flex-start"');
  if (q.mode === 'ownKey' && q.hint && !S.hintDismissed)
    top = callout(`<p>${ownKeyHintText}</p><div class="proto-row">${btn('改用內建翻譯', { act: 'goOnboardingLogin' })}${btn('不用了', { variant: 'ghost', act: 'dismissHint' })}</div>`, 'info', 'style="flex-direction:column;align-items:flex-start"');
  const translated = q.canTranslate;
  const quotaRow = q.mode === 'hosted' && q.signedIn
    ? `<div class="status-row proto-quota-row${q.low || q.usingFree ? ' proto-quota-row--warn' : ''}"><span>${q.reason ? exhaustedTitle(q) : remainingText(q)}</span>${q.plan === 'free' && !q.reason ? `<button type="button" class="proto-small-link" data-act="subscribe">訂閱</button>` : ''}</div>`
    : '';
  const button = q.reason ? btn('訂閱', { variant: 'primary', act: 'subscribe', attrs: q.reason === 'monthly' ? 'disabled' : '' }) : btn(translated ? '重新翻譯' : '翻譯此頁', { variant: translated ? 'secondary' : 'primary' });
  const statusText = translated ? (q.mode === 'ownKey' ? '已翻譯 2 頁 · claude-haiku-5-5 · 7.7 秒 · $0.00045' : '已翻譯 2 頁 · 7.7 秒') : '';
  return `<main>${header()}${pageModeSwitch()}${top}${levels()}${transcript(translated, translated ? '已翻譯' : '')}</main>
    ${footer(statusText, q.reason === 'monthly' ? '' : button, quotaRow)}`;
}

function panelB(q) {
  // 頂部徽章：一眼看到剩多少；點了展開細節。用完、未登入、提示是緊貼頂部的一條橫幅
  let chip = '';
  if (q.mode === 'hosted' && q.signedIn) {
    const label = q.reason ? '額度用完' : q.plan === 'free' ? `剩 ${q.free} 頁` : q.usingFree ? `免費剩 ${q.free}` : `本月剩 ${q.monthLeft}`;
    const tone = q.reason ? 'danger' : q.low || q.usingFree ? 'warn' : 'neutral';
    chip = `<button type="button" class="proto-chip proto-chip--${tone}" data-act="toggleQuota" aria-expanded="${S.quotaOpen}">${label} ▾</button>`;
  }
  if (q.mode === 'hosted' && !q.signedIn) chip = `<span class="naru-badge naru-badge--warn">未登入</span>`;
  const pop = S.quotaOpen && q.signedIn ? `<div class="panel-menu__popover proto-quota-pop">
      <p class="proto-k">方案</p><p>${q.plan === 'free' ? '免費' : '訂閱（年繳）'}</p>
      ${q.plan === 'sub' ? `<p class="proto-k">本月</p><p>剩 ${q.monthLeft} / ${q.monthLimit} 頁・${q.reset}重置</p>` : ''}
      <p class="proto-k">免費額度</p><p>剩 ${q.free} / 50 頁</p>
      ${q.plan === 'free' ? btn('訂閱：每月 800 頁', { variant: 'primary', act: 'subscribe' }) : ''}
      <button type="button" class="proto-small-link" data-act="goSettings">帳號設定</button>
    </div>` : '';
  let banner = '';
  if (q.mode === 'hosted' && !q.signedIn)
    banner = `<div class="proto-banner proto-banner--warn"><span>尚未登入，只顯示原文與讀音</span>${btn('登入', { variant: 'primary', act: 'goOnboardingLogin' })}</div><p class="proto-under-banner">${ownKeyLink()}</p>`;
  if (q.reason)
    banner = `<div class="proto-banner proto-banner--warn"><span><strong>${exhaustedTitle(q)}</strong></span>${q.reason === 'free' ? btn('訂閱', { variant: 'primary', act: 'subscribe' }) : ''}</div><p class="proto-under-banner">先顯示原文與讀音・${ownKeyLink()}</p>`;
  if (q.mode === 'ownKey' && q.hint && !S.hintDismissed)
    banner = `<div class="proto-banner"><span>${ownKeyHintText}</span><span class="proto-row">${btn('改用', { act: 'goOnboardingLogin' })}<button type="button" class="proto-x" data-act="dismissHint" aria-label="關閉提示">×</button></span></div>`;
  const translated = q.canTranslate;
  const statusText = translated ? (q.mode === 'ownKey' ? '已翻譯 2 頁 · claude-haiku-5-5 · 7.7 秒 · $0.00045' : '已翻譯 2 頁 · 7.7 秒') : '';
  return `<main><div class="proto-header-wrap">${header(chip)}${pop}</div>${banner}${pageModeSwitch()}${levels()}${transcript(translated, translated ? '已翻譯' : '')}</main>

}

function panelC(q) {
  // 帳號卡：Page Mode 下面一張卡片，有數字和進度條；用完時整張卡變成說明＋訂閱
  let card = '';
  if (q.mode === 'hosted' && !q.signedIn)
    card = `<section class="proto-card proto-card--warn" aria-label="內建翻譯"><p class="proto-card__title">內建翻譯・尚未登入</p><p>登入後就能翻譯；現在只顯示原文與讀音。</p><div class="proto-row">${btn('登入', { variant: 'primary', act: 'goOnboardingLogin' })}${ownKeyLink()}</div></section>`;
  else if (q.mode === 'hosted' && q.reason)
    card = `<section class="proto-card proto-card--warn" aria-label="內建翻譯"><p class="proto-card__title">${exhaustedTitle(q)}</p><p>${exhaustedBody(q)}</p><div class="proto-row">${q.reason === 'free' ? btn('訂閱：每月 800 頁', { variant: 'primary', act: 'subscribe' }) : ''}${ownKeyLink()}</div></section>`;
  else if (q.mode === 'hosted') {
    const [left, total, label] = q.plan === 'free' ? [q.free, 50, '免費額度'] : [q.monthLeft, q.monthLimit, '本月'];
    card = `<section class="proto-card" aria-label="內建翻譯">
      <div class="proto-card__head"><span class="proto-card__title">內建翻譯</span>${q.plan === 'free' ? badge('免費') : badge('訂閱中', 'ok')}</div>
      <div class="proto-meter"><span class="proto-meter__num">${left}</span><span class="proto-meter__of">/ ${total} 頁・${label}剩餘</span></div>
      <div class="proto-bar${q.low || q.usingFree ? ' proto-bar--warn' : ''}"><span style="width:${(left / total) * 100}%"></span></div>
      ${q.plan === 'sub' ? `<p class="hint">${q.reset}重置</p>` : ''}
      ${q.plan === 'free' ? `<div class="proto-row">${q.low ? btn('訂閱', { variant: 'primary', act: 'subscribe' }) : `<button type="button" class="proto-small-link" data-act="subscribe">訂閱：每月 800 頁</button>`}</div>` : ''}
    </section>`;
  } else if (q.hint && !S.hintDismissed)
    card = `<section class="proto-card" aria-label="內建翻譯提示"><div class="proto-card__head"><span class="proto-card__title">新功能：內建翻譯</span><button type="button" class="proto-x" data-act="dismissHint" aria-label="關閉提示">×</button></div><p>${ownKeyHintText}</p><div class="proto-row">${btn('改用內建翻譯', { act: 'goOnboardingLogin' })}</div></section>`;
  const translated = q.canTranslate;
  const statusText = translated ? (q.mode === 'ownKey' ? '已翻譯 2 頁 · claude-haiku-5-5 · 7.7 秒 · $0.00045' : '已翻譯 2 頁 · 7.7 秒') : '';
  return `<main>${header()}${pageModeSwitch()}${card}${levels()}${transcript(translated, translated ? '已翻譯' : '')}</main>
    ${footer(statusText, translated ? btn('重新翻譯') : '')}`;
}

function panelScreen() {
  const q = quota(S.panelState);
  if (q.mode === 'setup') return `<main>${setupScreen(S.variant)}</main>`;
  return { A: panelA, B: panelB, C: panelC }[S.variant](q);
}

// ========================= 設定區：獨立一頁（定案 B 版的卡片版面），兩種刪除確認 =========================
function account(state) {
  const base = { email: S.email };
  return {
    hostedFree: { ...base, mode: 'hosted', signedIn: true, plan: 'free', free: 37 },
    hostedSub: { ...base, mode: 'hosted', signedIn: true, plan: 'sub', monthLeft: 612, reset: '11 月 15 日', renew: '2027 年 10 月 15 日' },
    hostedCanceling: { ...base, mode: 'hosted', signedIn: true, plan: 'sub', monthLeft: 612, reset: '11 月 15 日', ends: '2027 年 10 月 15 日' },
    hostedPastDue: { ...base, mode: 'hosted', signedIn: true, plan: 'sub', monthLeft: 612, reset: '11 月 15 日', pastDue: true },
    hostedSignedOut: { mode: 'hosted', signedIn: false },
    ownKeyLoggedIn: { ...base, mode: 'ownKey', signedIn: true, plan: 'free', free: 37, key: 'a1b2' },
    ownKeyNoAccount: { mode: 'ownKey', signedIn: false, key: 'a1b2' },
  }[state];
}

function planBadge(a) {
  if (a.plan === 'free') return badge('免費');
  if (a.pastDue) return badge('扣款失敗，重試中', 'warn');
  if (a.ends) return badge('訂閱中・不會續訂', 'warn');
  return badge('訂閱中', 'ok');
}
function planDetail(a) {
  if (a.plan === 'free') return `免費額度剩 ${a.free} / 50 頁`;
  const lines = [`本月剩 ${a.monthLeft} / 800 頁，${a.reset}重置`];
  if (a.ends) lines.push(`訂閱在 ${a.ends}結束`);
  else if (a.pastDue) lines.push('Paddle 會再嘗試扣款，這段期間照常可以使用；請到「管理訂閱」更新付款方式');
  else lines.push(`下次續訂：${a.renew}`);
  return lines.join('<br>');
}

const ownKeyBlock = (a) => `<p>已設定 Claude API key（末四碼 ${a.key}）</p><div class="actions">${btn('測試連線')}${btn('刪除')}</div>
  <p class="hint">建議在 Anthropic Console 為這個外掛建立專用的 API key，並設定花費上限。key 只存在這台電腦。</p>`;

const deleteConsequences = `<ul class="proto-list"><li>剩下的頁數與用量紀錄都會刪除。</li><li>有訂閱的話會一起取消，不會再扣款；已付的費用不會自動退還。</li><li>之後用同一個 email 重新註冊，不會再有免費額度。</li><li>這台電腦上的翻譯快取、Series Notes 不受影響。</li></ul>`;

function accountActions(a) {
  return `<div class="actions">${a.plan === 'free' ? btn('訂閱', { variant: 'primary', act: 'subscribe' }) : btn('管理訂閱', { act: 'manage' })}${btn('登出', { act: 'signOut' })}${btn('刪除帳號', { variant: 'ghost', act: 'deleteStart', extra: 'proto-text-danger' })}</div>`;
}

/** 設定頁與刪除確認頁共用的頂部：← 返回＋標題，取代整個 side panel 的內容。 */
const pageHead = (title, back) => `<div class="panel-header">${btn('←', { variant: 'icon', act: back, attrs: 'aria-label="返回"' })}<h1 class="title">${title}</h1></div>`;

function deletePage() {
  return `<main>${pageHead('刪除帳號', 'deleteCancel')}
    <p>確定要刪除 <strong>${S.email}</strong> 的帳號？</p>${deleteConsequences}
    <div class="proto-row proto-gap-top">${btn('刪除帳號', { extra: 'proto-btn-danger', act: 'deleteDone' })}${btn('取消', { act: 'deleteCancel' })}</div></main>`;
}

function settingsPage(a, inlineDelete) {
  const card = (mode, title, desc, inner) => `<label class="proto-radio-card${a.mode === mode ? ' proto-radio-card--on' : ''}">
      <span class="proto-radio-card__head"><input type="radio" name="mode" ${a.mode === mode ? 'checked' : ''} data-act="setMode" data-value="${mode}"><span><strong>${title}</strong><span class="proto-radio-card__desc">${desc}</span></span></span>
      ${a.mode === mode ? `<div class="proto-radio-card__body">${inner}</div>` : ''}</label>`;
  const confirmInline = callout(`<p><strong>確定要刪除帳號？</strong></p>${deleteConsequences}<div class="proto-row">${btn('刪除帳號', { extra: 'proto-btn-danger', act: 'deleteDone' })}${btn('取消', { act: 'deleteCancel' })}</div>`, 'danger', 'role="alert" style="flex-direction:column;align-items:flex-start"');
  const hostedInner = a.signedIn
    ? `<p>${a.email}　${planBadge(a)}</p><p class="hint">${planDetail(a)}</p>${inlineDelete && S.deleting ? confirmInline : accountActions(a)}`
    : `<p>尚未登入。</p>${btn('登入', { variant: 'primary', act: 'goOnboardingLogin' })}`;
  const ownInner = `${ownKeyBlock(a)}${a.signedIn ? `<p class="hint">帳號 ${a.email} 仍然登入著；切回內建翻譯就能接著用。</p>` : ''}`;
  return `<main>${pageHead('設定', 'goPanel')}

    <div class="proto-radio-cards" role="radiogroup" aria-label="翻譯方式">
      ${card('hosted', '內建翻譯', '用 email 帳號，Naruhodo 代為翻譯，有頁數限制', hostedInner)}
      ${card('ownKey', '自備金鑰', '用你自己的 Anthropic API key，費用直接付給 Anthropic，沒有頁數限制', ownInner)}
    </div>
    <h2 class="proto-h3">資料</h2>
    <p class="hint">在兩台電腦之間搬 Series、Series Notes 與翻譯快取（不含 API key 與帳號）。</p>
    <div class="backup">${btn('匯出 JSON')}${btn('匯入 JSON')}</div></main>`;
}

function settingsScreen() {
  const a = account(S.settingsState);
  // A：刪除確認是另一頁；B：在卡片裡原地展開
  if (S.variant === 'A' && S.deleting) return deletePage();
  return settingsPage(a, S.variant !== 'A');
}

function stepLogin() {
  const masked = S.email;
  if (['code', 'codeWrong', 'codeExpired', 'tooMany'].includes(S.sub)) {
    const err = {
      codeWrong: callout('<p>驗證碼不正確，請再確認一次。</p>', 'danger', 'role="alert"'),
      codeExpired: callout('<p>驗證碼已經過期，請重新寄送。</p>', 'danger', 'role="alert"'),
      tooMany: callout('<p>錯誤次數太多，這組驗證碼已失效，請重新寄送。</p>', 'danger', 'role="alert"'),
    }[S.sub] ?? '';
    const locked = S.sub === 'tooMany' || S.sub === 'codeExpired';
    return `<h2 class="ob-h2">輸入驗證碼</h2>
      <p>我們寄了一封含 6 位數驗證碼的信到 <strong>${masked}</strong>。沒看到的話，請找找垃圾郵件匣。</p>

      <form class="ob-form" data-form="verify"><label class="proto-field">驗證碼<input class="ob-code" data-input="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="${esc(S.code)}" ${locked ? 'disabled' : ''} placeholder="123456"></label>
      ${btn('登入', { variant: 'primary', act: 'verify', attrs: locked ? 'disabled' : '' })}</form>
      <p class="ob-links">${S.resendIn > 0 ? `<span class="hint">${S.resendIn} 秒後可以重新寄送</span>` : `<button type="button" class="proto-small-link" data-act="resend">重新寄送驗證碼</button>`}・<button type="button" class="proto-small-link" data-act="changeEmail">改用其他 email</button></p>`;
  }

    <p>翻譯前，先確認資料怎麼使用：</p>${consentList}

    <div class="ob-plans">

      <div class="ob-plan ob-plan--hl"><p class="ob-plan__name">訂閱（年繳）${TBD}</p><p class="ob-plan__price">US$20 / 年</p><p class="hint">每月可翻 800 頁，從訂閱那天起每月同一天重置。</p>${btn('訂閱', { variant: 'primary', act: 'subscribeOb' })}</div>

const STEP_TITLES = ['說明', '同意並登入', '選擇方案', '開始翻譯'];
const stepBody = () => (S.sub === 'ownkey' ? stepOwnKey() : [null, () => `${stepIntro()}${introActions()}`, stepLogin, stepPlan, stepTutorial][S.step]());
const ownKeyFooter = () => S.sub === 'ownkey' ? '' : `<p class="ob-foot">已經有 Anthropic API key？<button type="button" class="proto-small-link" data-act="obOwnKey">使用自備金鑰</button></p>`;

function doneScreen() {
  return `<div class="ob-done">${LOGO.replace('24', '56').replace('24', '56')}<h1 class="ob-h1">設定完成</h1><p>可以關閉這個分頁，到漫畫網站點 Naruhodo 圖示開始翻譯。</p>${btn('關閉分頁', { variant: 'primary' })}</div>`;
}

function onboardingA() {
  // 單欄精靈：一次只看一步，上面是進度點
  const dots = STEP_TITLES.map((t, i) => `<li class="${i + 1 < S.step ? 'done' : i + 1 === S.step ? 'cur' : ''}"><span>${i + 1}</span>${t}</li>`).join('');
  return `<div class="ob-a"><header class="ob-brand">${LOGO}Naruhodo</header>
    ${S.sub === 'ownkey' ? '' : `<ol class="ob-dots">${dots}</ol>`}
    <div class="ob-a__card">${stepBody()}</div>
    ${S.step > 1 && S.step < 4 && S.sub !== 'ownkey' && !['code', 'codeWrong', 'codeExpired', 'tooMany'].includes(S.sub) ? `<p class="ob-back"><button type="button" class="proto-small-link" data-act="obBack">← 上一步</button></p>` : ''}
    ${ownKeyFooter()}</div>`;
}

function onboardingB() {
  // 兩欄：左邊永遠看得到全部步驟與每步的結果，右邊是目前這步
  const items = STEP_TITLES.map((t, i) => {
    const n = i + 1;
    const state = S.sub === 'ownkey' ? '' : n < S.step ? 'done' : n === S.step ? 'cur' : '';
    const result = n === 2 && S.step > 2 ? `<span class="ob-b__res">${S.email}</span>` : n === 3 && S.step > 3 ? `<span class="ob-b__res">${S.sub === 'paid' || S.paid ? '已訂閱' : '先用免費額度'}</span>` : '';
    return `<li class="${state}"><span class="ob-b__n">${n < S.step && S.sub !== 'ownkey' ? '✓' : n}</span><span>${t}${result}</span></li>`;
  }).join('');
  return `<div class="ob-b"><aside class="ob-b__side"><header class="ob-brand">${LOGO}Naruhodo</header><ol class="ob-b__steps">${items}</ol>
      <div class="ob-b__sidefoot">${ownKeyFooter()}</div></aside>
    <section class="ob-b__main">${stepBody()}</section></div>`;
}

function onboardingC() {
  // 一頁長捲：每一步都看得到，還沒輪到的變淡鎖住，完成的收成一行摘要
  const summary = (n) => ({ 1: '已閱讀說明', 2: `已登入 ${S.email}`, 3: S.paid ? '已訂閱' : '先用免費的 50 頁' })[n];
  const sections = STEP_TITLES.map((t, i) => {
    const n = i + 1;
    if (S.sub === 'ownkey') return '';
    if (n < S.step) return `<section class="ob-c__sec ob-c__sec--done"><span class="ob-c__n">✓</span><span><strong>${t}</strong>・${summary(n)}</span></section>`;
    if (n === S.step) return `<section class="ob-c__sec ob-c__sec--cur"><span class="ob-c__n">${n}</span><div class="ob-c__body">${stepBody()}</div></section>`;
    return `<section class="ob-c__sec ob-c__sec--locked"><span class="ob-c__n">${n}</span><span><strong>${t}</strong></span></section>`;
  }).join('');
  return `<div class="ob-c"><header class="ob-brand">${LOGO}Naruhodo</header>
    ${S.step === 1 && S.sub !== 'ownkey' ? '' : ''}
    ${S.sub === 'ownkey' ? `<section class="ob-c__sec ob-c__sec--cur"><div class="ob-c__body">${stepOwnKey()}</div></section>` : sections}
    ${ownKeyFooter()}</div>`;
}

function onboardingScreen() {
  if (S.sub === 'done') return doneScreen();
  return { A: onboardingA, B: onboardingB, C: onboardingC }[S.variant]();
}

const STYLES = `<link rel="stylesheet" href="../shared/tokens.css"><link rel="stylesheet" href="components.css">`;

let host;
function mount(kind) {
  const stage = document.getElementById('stage');
  if (kind === 'onboarding') {
    stage.innerHTML = `<div class="pt-tab"><div class="pt-tab__chrome">◀ ▶ ⟳ <span class="pt-tab__url">chrome-extension://…/onboarding.html</span></div><div class="pt-tab__body" id="host"></div></div>`;
  } else {
    stage.innerHTML = `<div class="pt-window"><div class="pt-page"></div><div class="pt-sidepanel"><div class="pt-sidepanel__chrome">${LOGO.replace('24', '14').replace('24', '14')} Naruhodo</div><div class="pt-sidepanel__body" id="host"></div></div></div>`;
  }
  host = document.getElementById('host').attachShadow({ mode: 'open' });
  host.addEventListener('click', onClick);
  host.addEventListener('input', onInput);
  host.addEventListener('submit', (e) => e.preventDefault());
  host.addEventListener('change', onChange);
}

let mounted;
function render() {
  if (!VARIANT_NAMES[S.screen][S.variant]) S.variant = 'A';
  syncUrl();
  if (mounted !== (S.screen === 'onboarding' ? 'onboarding' : 'panel')) {
    mounted = S.screen === 'onboarding' ? 'onboarding' : 'panel';
    mount(mounted);
  }
  const content = S.screen === 'onboarding'
    ? `${STYLES}<style>${PROTO_CSS}${ONBOARDING_CSS}</style><div class="ob">${onboardingScreen()}</div>`
    : `${STYLES}<link rel="stylesheet" href="sidepanel.css"><style>${PROTO_CSS}</style><div class="sp">${S.screen === 'panel' ? panelScreen() : settingsScreen()}</div>`;
  host.innerHTML = content;
  renderBar();
  const names = VARIANT_NAMES[S.screen];
  document.getElementById('variant-label').textContent = `${S.variant}（${names[S.variant]}）`;
}

function renderBar() {
  const tabs = [['onboarding', '全頁 onboarding'], ['panel', 'side panel'], ['settings', '設定區']]
    .map(([k, l]) => `<button type="button" data-screen="${k}" aria-pressed="${S.screen === k}">${l}</button>`).join('');
  let states;
  if (S.screen === 'panel') states = Object.entries(PANEL_STATES).map(([k, l]) => `<button type="button" data-state="${k}" aria-pressed="${S.panelState === k}">${l}</button>`).join('');
  else if (S.screen === 'settings') states = Object.entries(SETTINGS_STATES).map(([k, l]) => `<button type="button" data-settings="${k}" aria-pressed="${S.settingsState === k}">${l}</button>`).join('');
  else states = Object.entries(ONBOARDING_STATES).map(([k, l]) => {
    const [step, sub] = k.split(':');
    const cur = (S.sub === 'ownkey' && sub === 'ownkey') || (S.sub === 'done' && sub === 'done') || (String(S.step) === step && (S.sub || '') === sub);
    return `<button type="button" data-ob="${k}" aria-pressed="${cur}">${l}</button>`;
  }).join('');
  const dump = S.screen === 'onboarding' ? { step: S.step, sub: S.sub, email: S.email, wrongTries: S.wrongTries } : S.screen === 'panel' ? { state: S.panelState, ...quota(S.panelState) } : { state: S.settingsState, ...account(S.settingsState), deleting: S.deleting };
  document.getElementById('bar').innerHTML = `<div class="pt-bar"><strong>PROTOTYPE・spec #86 外掛帳號畫面</strong><span class="pt-tabs">${tabs}</span><span class="pt-dump">${esc(JSON.stringify(dump))}</span></div>
    <div class="pt-states"><span>狀態：</span>${states}</div>`;
}

document.getElementById('bar').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.screen) { S.screen = b.dataset.screen; S.deleting = false; S.quotaOpen = false; if (!VARIANT_NAMES[S.screen][S.variant]) S.variant = 'A'; }
  if (b.dataset.state) { S.panelState = b.dataset.state; S.hintDismissed = false; S.quotaOpen = false; }
  if (b.dataset.settings) { S.settingsState = b.dataset.settings; S.deleting = false; }
  if (b.dataset.ob) {
    const [step, sub] = b.dataset.ob.split(':');
    S.step = Number(step) || 1; S.sub = sub; S.code = ''; S.wrongTries = sub === 'tooMany' ? 5 : 0;
    if (sub === 'ownkey' || sub === 'done') S.step = sub === 'done' ? 4 : 1;
  }
  render();
});

let timer;
function startResendTimer() {
  S.resendIn = 30;
  clearInterval(timer);
  timer = setInterval(() => { S.resendIn -= 1; if (S.resendIn <= 0) clearInterval(timer); if (S.screen === 'onboarding') render(); }, 1000);
}

const ACTIONS = {
  goSettings: () => { S.screen = 'settings'; S.quotaOpen = false; },
  goPanel: () => { S.screen = 'panel'; S.deleting = false; },
  goOnboarding: () => { S.screen = 'onboarding'; S.step = 3; S.sub = 'choose'; },
  goOnboardingLogin: () => { S.screen = 'onboarding'; S.step = 2; S.sub = 'email'; },
  useOwnKey: () => { S.screen = 'settings'; S.settingsState = 'ownKeyLoggedIn'; },
  subscribe: () => alert('（prototype）用新分頁打開 #89 的 checkout 頁'),
  manage: () => alert('（prototype）用新分頁打開 Paddle customer portal：取消訂閱、更換付款方式、收據'),
  dismissHint: () => { S.hintDismissed = true; },
  toggleQuota: () => { S.quotaOpen = !S.quotaOpen; },
  setMode: (b) => {
    const signedIn = account(S.settingsState).signedIn;
    S.settingsState = b.dataset.value === 'ownKey' ? (signedIn ? 'ownKeyLoggedIn' : 'ownKeyNoAccount') : (signedIn ? 'hostedFree' : 'hostedSignedOut');
  },
  signOut: () => { S.settingsState = 'hostedSignedOut'; },
  deleteStart: () => { S.deleting = true; S.deleteTyped = ''; },
  deleteCancel: () => { S.deleting = false; },
  deleteDone: () => { S.deleting = false; S.settingsState = 'hostedSignedOut'; },
  obNext: () => { S.step += 1; S.sub = { 2: 'email', 3: 'choose', 4: '' }[S.step] ?? ''; },
  obBack: () => { S.step -= 1; S.sub = { 1: '', 2: 'email', 3: 'choose' }[S.step]; },
  sendCode: () => { S.sub = 'code'; S.code = ''; S.wrongTries = 0; startResendTimer(); },
  resend: () => { S.sub = 'code'; S.code = ''; S.wrongTries = 0; startResendTimer(); },
  changeEmail: () => { S.sub = 'email'; },
  verify: () => {
    if (S.code === '123456') { S.step = 3; S.sub = 'choose'; return; }
    if (S.code === '000000') { S.sub = 'codeExpired'; return; }
    S.wrongTries += 1;
    S.sub = S.wrongTries >= 5 ? 'tooMany' : 'codeWrong';
  },
  subscribeOb: () => { S.sub = 'waitingPayment'; },
  paid: () => { S.sub = 'paid'; S.paid = true; },
  useFree: () => { S.step = 4; S.sub = ''; S.paid = false; },
  // 定案：按「完成」直接 window.close()，不顯示「設定完成」頁（狀態列的「完成」只留著看文案）
  finish: () => { alert('（prototype）window.close()：直接關掉 onboarding 分頁'); },
  obOwnKey: () => { S.sub = 'ownkey'; },
  obBackToLogin: () => { S.step = 1; S.sub = ''; },
  ownKeySaved: () => { S.step = 4; S.sub = ''; },
};

function onClick(e) {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  // radio 的 change 交給 onChange
  if (el.tagName === 'INPUT') return;
  e.preventDefault();
  ACTIONS[el.dataset.act]?.(el);
  render();
}
function onChange(e) {
  const el = e.target.closest('input[type=radio][data-act]');
  if (!el) return;
  ACTIONS[el.dataset.act]?.(el);
  render();
}
function onInput(e) {
  const key = e.target.dataset.input;
  if (!key) return;
  S[key] = e.target.value;
  // 刪除帳號的確認按鈕要跟著輸入啟用，局部更新就好，不重畫（避免失去焦點）
  if (key === 'deleteTyped') {
    const b = host.querySelector('[data-act="deleteDone"]');
    if (b) b.disabled = S.deleteTyped.trim() !== S.email;
  }
}

function cycle(delta) {
  const keys = Object.keys(VARIANT_NAMES[S.screen]);
  S.variant = keys[(Math.max(0, keys.indexOf(S.variant)) + delta + keys.length) % keys.length];
  S.quotaOpen = false;
  render();
}
document.getElementById('prev').addEventListener('click', () => cycle(-1));
document.getElementById('next').addEventListener('click', () => cycle(1));
document.addEventListener('keydown', (e) => {
  const target = e.composedPath()[0];
  if (target instanceof HTMLElement && (target.matches('input, textarea, select') || target.isContentEditable)) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});

render();
</script>
</body>
</html>
